name: Verify GitHub Secrets Health

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify_secrets.yml'

jobs:
  verify:
    name: Secrets & Channels Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Configured Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FANVUE_ACCESS_TOKEN: ${{ secrets.FANVUE_ACCESS_TOKEN }}
          FANVUE_REFRESH_TOKEN: ${{ secrets.FANVUE_REFRESH_TOKEN }}
          FANVUE_CLIENT_ID: ${{ secrets.FANVUE_CLIENT_ID }}
          FANVUE_CLIENT_SECRET: ${{ secrets.FANVUE_CLIENT_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
          TIKTOK_SESSION_JSON: ${{ secrets.TIKTOK_SESSION_JSON }}
          PINTEREST_SESSION_JSON: ${{ secrets.PINTEREST_SESSION_JSON }}
          REDDIT_SESSION_JSON: ${{ secrets.REDDIT_SESSION_JSON }}
          TWITTER_SESSION_JSON: ${{ secrets.TWITTER_SESSION_JSON }}
        run: |
          echo "### 🔐 GitHub Actions Secrets Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Name | Status | Type |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY

          check_secret() {
            local name="$1"
            local val="$2"
            local cat="$3"
            if [ -n "$val" ]; then
              echo "| \`$name\` | 🟢 **Configured** (${#val} chars) | $cat |" >> $GITHUB_STEP_SUMMARY
              echo "✅ $name: CONFIGURED"
            else
              echo "| \`$name\` | ❌ **Missing** | $cat |" >> $GITHUB_STEP_SUMMARY
              echo "❌ $name: MISSING"
            fi
          }

          check_secret "GEMINI_API_KEY" "$GEMINI_API_KEY" "Core AI"
          check_secret "FANVUE_ACCESS_TOKEN" "$FANVUE_ACCESS_TOKEN" "Fanvue API"
          check_secret "FANVUE_REFRESH_TOKEN" "$FANVUE_REFRESH_TOKEN" "Fanvue API"
          check_secret "FANVUE_CLIENT_ID" "$FANVUE_CLIENT_ID" "Fanvue API"
          check_secret "FANVUE_CLIENT_SECRET" "$FANVUE_CLIENT_SECRET" "Fanvue API"
          check_secret "GMAIL_USER" "$GMAIL_USER" "Notification"
          check_secret "GMAIL_APP_PASSWORD" "$GMAIL_APP_PASSWORD" "Notification"
          check_secret "INSTAGRAM_SESSION_JSON" "$INSTAGRAM_SESSION_JSON" "Instagram"
          check_secret "TIKTOK_SESSION_JSON" "$TIKTOK_SESSION_JSON" "TikTok"
          check_secret "PINTEREST_SESSION_JSON" "$PINTEREST_SESSION_JSON" "Pinterest"
          check_secret "REDDIT_SESSION_JSON" "$REDDIT_SESSION_JSON" "Reddit"
          check_secret "TWITTER_SESSION_JSON" "$TWITTER_SESSION_JSON" "X (Twitter)"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*(Report generated automatically at $(date -u))* " >> $GITHUB_STEP_SUMMARY
