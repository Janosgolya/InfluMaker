name: Verify GitHub Secrets Health

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify_secrets.yml'

jobs:
  verify:
    name: Secrets & Channels Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Configured Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FANVUE_ACCESS_TOKEN: ${{ secrets.FANVUE_ACCESS_TOKEN }}
          FANVUE_REFRESH_TOKEN: ${{ secrets.FANVUE_REFRESH_TOKEN }}
          FANVUE_CLIENT_ID: ${{ secrets.FANVUE_CLIENT_ID }}
          FANVUE_CLIENT_SECRET: ${{ secrets.FANVUE_CLIENT_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
          TIKTOK_SESSION_JSON: ${{ secrets.TIKTOK_SESSION_JSON }}
          PINTEREST_SESSION_JSON: ${{ secrets.PINTEREST_SESSION_JSON }}
          REDDIT_SESSION_JSON: ${{ secrets.REDDIT_SESSION_JSON }}
          TWITTER_SESSION_JSON: ${{ secrets.TWITTER_SESSION_JSON }}
        run: |
          echo "======================================================"
          echo "🔍 AUDITING GITHUB ACTIONS SECRETS..."
          echo "======================================================"
          
          check_secret() {
            local name="$1"
            local val="$2"
            if [ -n "$val" ]; then
              echo "✅ $name: CONFIGURED (${#val} characters)"
            else
              echo "❌ $name: MISSING / NOT SET"
            fi
          }

          echo "--- Core AI & APIs ---"
          check_secret "GEMINI_API_KEY" "$GEMINI_API_KEY"
          check_secret "FANVUE_ACCESS_TOKEN" "$FANVUE_ACCESS_TOKEN"
          check_secret "FANVUE_REFRESH_TOKEN" "$FANVUE_REFRESH_TOKEN"
          check_secret "FANVUE_CLIENT_ID" "$FANVUE_CLIENT_ID"
          check_secret "FANVUE_CLIENT_SECRET" "$FANVUE_CLIENT_SECRET"

          echo "--- Email Notifications ---"
          check_secret "GMAIL_USER" "$GMAIL_USER"
          check_secret "GMAIL_APP_PASSWORD" "$GMAIL_APP_PASSWORD"

          echo "--- Omni-Channel Social Sessions ---"
          check_secret "INSTAGRAM_SESSION_JSON" "$INSTAGRAM_SESSION_JSON"
          check_secret "TIKTOK_SESSION_JSON" "$TIKTOK_SESSION_JSON"
          check_secret "PINTEREST_SESSION_JSON" "$PINTEREST_SESSION_JSON"
          check_secret "REDDIT_SESSION_JSON" "$REDDIT_SESSION_JSON"
          check_secret "TWITTER_SESSION_JSON" "$TWITTER_SESSION_JSON"

          echo "======================================================"
