name: Verify GitHub Secrets Health

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify_secrets.yml'

permissions:
  contents: write

jobs:
  verify:
    name: Secrets & Channels Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Configured Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FANVUE_ACCESS_TOKEN: ${{ secrets.FANVUE_ACCESS_TOKEN }}
          FANVUE_REFRESH_TOKEN: ${{ secrets.FANVUE_REFRESH_TOKEN }}
          FANVUE_CLIENT_ID: ${{ secrets.FANVUE_CLIENT_ID }}
          FANVUE_CLIENT_SECRET: ${{ secrets.FANVUE_CLIENT_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
          TIKTOK_SESSION_JSON: ${{ secrets.TIKTOK_SESSION_JSON }}
          PINTEREST_SESSION_JSON: ${{ secrets.PINTEREST_SESSION_JSON }}
          REDDIT_SESSION_JSON: ${{ secrets.REDDIT_SESSION_JSON }}
          TWITTER_SESSION_JSON: ${{ secrets.TWITTER_SESSION_JSON }}
        run: |
          mkdir -p config
          node -e '
          const fs = require("fs");
          const env = process.env;
          const secrets = [
            { name: "GEMINI_API_KEY", category: "Core AI", val: env.GEMINI_API_KEY },
            { name: "FANVUE_ACCESS_TOKEN", category: "Fanvue API", val: env.FANVUE_ACCESS_TOKEN },
            { name: "FANVUE_REFRESH_TOKEN", category: "Fanvue API", val: env.FANVUE_REFRESH_TOKEN },
            { name: "FANVUE_CLIENT_ID", category: "Fanvue API", val: env.FANVUE_CLIENT_ID },
            { name: "FANVUE_CLIENT_SECRET", category: "Fanvue API", val: env.FANVUE_CLIENT_SECRET },
            { name: "GMAIL_USER", category: "Notifications", val: env.GMAIL_USER },
            { name: "GMAIL_APP_PASSWORD", category: "Notifications", val: env.GMAIL_APP_PASSWORD },
            { name: "INSTAGRAM_SESSION_JSON", category: "Instagram", val: env.INSTAGRAM_SESSION_JSON },
            { name: "TIKTOK_SESSION_JSON", category: "TikTok", val: env.TIKTOK_SESSION_JSON },
            { name: "PINTEREST_SESSION_JSON", category: "Pinterest", val: env.PINTEREST_SESSION_JSON },
            { name: "REDDIT_SESSION_JSON", category: "Reddit", val: env.REDDIT_SESSION_JSON },
            { name: "TWITTER_SESSION_JSON", category: "X (Twitter)", val: env.TWITTER_SESSION_JSON }
          ];
          const results = secrets.map(s => ({
            name: s.name,
            category: s.category,
            configured: !!(s.val && s.val.trim().length > 0),
            length: s.val ? s.val.trim().length : 0
          }));
          fs.writeFileSync("config/github_secrets_health.json", JSON.stringify({
            auditedAt: new Date().toISOString(),
            total: results.length,
            configuredCount: results.filter(r => r.configured).length,
            missingCount: results.filter(r => !r.configured).length,
            secrets: results
          }, null, 2), "utf8");
          '

      - name: Commit & Push Audit Report
        run: |
          git config --global user.name "GitHub Actions Secret Auditor"
          git config --global user.email "actions@github.com"
          git add config/github_secrets_health.json
          git commit -m "ci: update github_secrets_health.json audit report [skip ci]" || exit 0
          git push origin main
