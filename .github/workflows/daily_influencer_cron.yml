name: InfluMaker Daily Autonomous Scheduler

on:
  schedule:
    # 4 times daily (UTC): 06:00 (MORNING), 11:00 (MIDDAY), 16:00 (PREP), 20:00 (NIGHT)
    - cron: '0 6,11,16,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-daily-tick:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code & Media
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Restore Social Sessions
        env:
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
          TIKTOK_SESSION_JSON: ${{ secrets.TIKTOK_SESSION_JSON }}
          PINTEREST_SESSION_JSON: ${{ secrets.PINTEREST_SESSION_JSON }}
          REDDIT_SESSION_JSON: ${{ secrets.REDDIT_SESSION_JSON }}
          TWITTER_SESSION_JSON: ${{ secrets.TWITTER_SESSION_JSON }}
        run: |
          mkdir -p config
          if [ -n "$INSTAGRAM_SESSION_JSON" ]; then
            printf '%s' "$INSTAGRAM_SESSION_JSON" > config/instagram_session.json
            echo "[Restore] Instagram session restored ($(wc -c < config/instagram_session.json) bytes)"
          fi
          if [ -n "$TIKTOK_SESSION_JSON" ]; then
            printf '%s' "$TIKTOK_SESSION_JSON" > config/tiktok_session.json
            echo "[Restore] TikTok session restored ($(wc -c < config/tiktok_session.json) bytes)"
          fi
          if [ -n "$PINTEREST_SESSION_JSON" ]; then
            printf '%s' "$PINTEREST_SESSION_JSON" > config/pinterest_session.json
            echo "[Restore] Pinterest session restored ($(wc -c < config/pinterest_session.json) bytes)"
          fi
          if [ -n "$REDDIT_SESSION_JSON" ]; then
            printf '%s' "$REDDIT_SESSION_JSON" > config/reddit_session.json
            echo "[Restore] Reddit session restored ($(wc -c < config/reddit_session.json) bytes)"
          fi
          if [ -n "$TWITTER_SESSION_JSON" ]; then
            printf '%s' "$TWITTER_SESSION_JSON" > config/twitter_session.json
            echo "[Restore] Twitter session restored ($(wc -c < config/twitter_session.json) bytes)"
          fi

      - name: Execute George Producer Tick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FANVUE_ACCESS_TOKEN: ${{ secrets.FANVUE_ACCESS_TOKEN }}
          FANVUE_REFRESH_TOKEN: ${{ secrets.FANVUE_REFRESH_TOKEN }}
          FANVUE_CLIENT_ID: ${{ secrets.FANVUE_CLIENT_ID }}
          FANVUE_CLIENT_SECRET: ${{ secrets.FANVUE_CLIENT_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node src/agents/george.js --tick

      - name: Commit and Push Updated Log
        run: |
          git config --global user.name "George [InfluMaker AI]"
          git config --global user.email "george@influmaker.local"
          git add config/published_log.json
          git diff-index --quiet HEAD || git commit -m "chore(george): update published_log after scheduled cycle [skip ci]"
          git push
